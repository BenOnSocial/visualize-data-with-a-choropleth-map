name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Change to 'master' if using an older repo

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build # Ensure this script exists in package.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # Folder where your built files live

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
